global
    # send logs to syslog server
    log syslog:514 local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:Ahead$99
    stats hide-version
    stats admin if TRUE

frontend inbound_traffic
    bind *:80
    default_backend backend_pool

backend backend_pool
    balance leastconn
    # Risoluzione DNS interna di Docker per i container
    server nginx1 web1:80 check
    server nginx2 web2:80 check
    server nginx3 web3:80 check
