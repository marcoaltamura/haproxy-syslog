services:
  # Syslog container
  syslog:
    image: rsyslog/rsyslog:latest
    container_name: syslog_server
    volumes:
      - ./rsyslog.conf:/etc/rsyslog.conf:ro
      - ./logs:/var/log
    networks:
      - haproxysyslog-vnet

  # Backend webservers
  web1:
    image: nginx:alpine
    container_name: nginx_web1
    command: /bin/sh -c "echo 'Benvenuto da Web 1' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - haproxysyslog-vnet

  web2:
    image: nginx:alpine
    container_name: nginx_web2
    command: /bin/sh -c "echo 'Benvenuto da Web 2' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - haproxysyslog-vnet

  web3:
    image: nginx:alpine
    container_name: nginx_web3
    command: /bin/sh -c "echo 'Benvenuto da Web 3' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - haproxysyslog-vnet

  # Load Balancer
  haproxy:
    image: haproxy:alpine
    container_name: haproxy_lb
    ports:
      - "80:80"
      - "1936:1936"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - syslog
      - web1
      - web2
      - web3
    networks:
      - haproxysyslog-vnet

networks:
  haproxysyslog-vnet:
    driver: bridge
